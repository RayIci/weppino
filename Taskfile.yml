version: "3"

includes:
  infra:
    taskfile: ./infrastructure/Taskfile.yml
    dir: ./infrastructure

tasks:
  setup:
    desc: Install developer tools and wire up git hooks (run once after cloning)
    cmds:
      - bash scripts/setup.sh

  gradle:auth:
    desc: Configure ~/.gradle/gradle.properties with GitHub Packages credentials (run once per developer)
    cmds:
      - bash scripts/gradle-auth.sh

  bootstrap:
    desc: Bootstrap the local Kubernetes dev cluster (run once after cloning)
    cmds:
      - task: infra:bootstrap

  format:
    desc: Format all projects and root files
    cmds:
      - |
        for dir in services/*/ libs/*/ apps/*/; do
          if [ -f "${dir}Taskfile.yml" ]; then
            echo "Formatting ${dir}..."
            (cd "${dir}" && task format)
          fi
        done
      - task: format:md
      - task: format:yaml
      - task: format:json

  format:md:
    desc: Format all Markdown files
    cmds:
      - bunx prettier --write "**/*.md"

  format:yaml:
    desc: Format all YAML files
    cmds:
      - bunx prettier --write "**/*.yaml" "**/*.yml"

  format:json:
    desc: Format all JSON files
    cmds:
      - bunx prettier --write "**/*.json"

  lint:
    desc: Lint all projects
    cmds:
      - |
        for dir in services/*/ libs/*/ apps/*/; do
          if [ -f "${dir}Taskfile.yml" ]; then
            echo "Linting ${dir}..."
            (cd "${dir}" && task lint)
          fi
        done

  test:
    desc: Test all projects
    cmds:
      - |
        for dir in services/*/ libs/*/ apps/*/; do
          if [ -f "${dir}Taskfile.yml" ]; then
            echo "Testing ${dir}..."
            (cd "${dir}" && task test)
          fi
        done
