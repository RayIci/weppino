version: "3"

includes:
  infra:
    taskfile: ./infrastructure/Taskfile.yml
    dir: ./infrastructure

tasks:
  setup:
    desc: Install developer tools and wire up git hooks (run once after cloning)
    cmds:
      - bash scripts/setup.sh

  bootstrap:
    desc: Bootstrap the local Kubernetes dev cluster (run once after cloning)
    cmds:
      - task: infra:bootstrap

  format:
    desc: Format all projects
    cmds:
      - |
        for dir in services/*/ libs/*/ apps/*/; do
          if [ -f "${dir}Taskfile.yml" ]; then
            echo "Formatting ${dir}..."
            (cd "${dir}" && task format)
          fi
        done

  lint:
    desc: Lint all projects
    cmds:
      - |
        for dir in services/*/ libs/*/ apps/*/; do
          if [ -f "${dir}Taskfile.yml" ]; then
            echo "Linting ${dir}..."
            (cd "${dir}" && task lint)
          fi
        done

  test:
    desc: Test all projects
    cmds:
      - |
        for dir in services/*/ libs/*/ apps/*/; do
          if [ -f "${dir}Taskfile.yml" ]; then
            echo "Testing ${dir}..."
            (cd "${dir}" && task test)
          fi
        done
