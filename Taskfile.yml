    desc: Format all projects
    deps: [shared-kernel:format, store-website:format]

  lint:
    desc: Lint all projects
    deps: [shared-kernel:lint, store-website:lint]

  test:
    desc: Test all projects
    deps: [shared-kernel:test, store-website:test]
