---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: identity

resources:
  - ../base
  - keycloak.yaml
  - postgres.yaml
  - keycloak-admin-secret.yaml
  - realm-vars.yaml
  - mailpit.yaml

images:
  - name: adorsys/keycloak-config-cli
    newTag: 6.4.0-26.3.3

configMapGenerator:
  - name: keycloak-realm-config
    files:
      - realm.yaml
