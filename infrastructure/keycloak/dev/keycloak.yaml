---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.3.3
          # "start-dev" enables development mode: relaxed hostname/SSL checks, detailed
          # logs, and no startup optimisation. Never use this in prod.
          args: ["start-dev"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak

            # Database credentials injected from the postgres-secret defined in postgres.yaml.
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            # Admin credentials injected from keycloak-admin-secret.yaml.
            # Even in dev we use a Secret rather than plaintext to keep the pattern
            # consistent with prod and avoid accidentally promoting hardcoded values.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD

            # Required for liveness/readiness probes to work. Exposes /health/live
            # and /health/ready on the management port (9000).
            - name: KC_HEALTH_ENABLED
              value: "true"

            # Allows the realm endpoints to respond to any Host header (nip.io, localhost,
            # etc.). In dev, traffic comes from multiple origins so a fixed hostname would
            # require extra config for every access pattern. Never set this to false in prod.
            - name: KC_HOSTNAME_STRICT
              value: "false"

            # Restricts the admin console to requests whose Host header matches this URL.
            # Requests arriving via the ingress get a 404 because their Host header
            # does not match — only port-forward traffic does.
            # Access the admin console via:
            #   kubectl port-forward svc/keycloak 8080:80 -n identity
            # then open http://localhost:8080
            - name: KC_HOSTNAME_ADMIN
              value: "http://localhost:8080"

          ports:
            - containerPort: 8080
            - containerPort: 9000
              name: management

          # Dev mode starts faster than prod, but still needs a short delay for the JVM
          # and the DB connection to stabilise before probes begin.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: identity
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 80
      targetPort: 8080
    # Management port exposed internally so the keycloak-config-cli Job initContainer
    # can poll /health/ready before applying realm config.
    - name: management
      port: 9000
      targetPort: 9000
