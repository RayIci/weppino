---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.3.3
          # "start" enables production-hardened mode: enforces HTTPS, strict hostname
          # checking, and disables development-only features. Never use "start-dev" in prod.
          args: ["start"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak

            # Database credentials are injected from a Secret that must be manually
            # applied before ArgoCD syncs. Never hardcode credentials in the Deployment.
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            # Admin credentials injected from a manually applied Secret (never in git).
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: KEYCLOAK_ADMIN_PASSWORD

            # Required for liveness/readiness probes to work. Exposes /health/live
            # and /health/ready on the management port (9000).
            - name: KC_HEALTH_ENABLED
              value: "true"

            # TLS is terminated at ingress-nginx, not at Keycloak itself.
            # Keycloak communicates over plain HTTP internally within the cluster.
            - name: KC_HTTP_ENABLED
              value: "true"

            # Tells Keycloak it is behind a reverse proxy forwarding X-Forwarded-* headers.
            # Required so Keycloak generates correct redirect URIs and token issuer URLs
            # using the original HTTPS scheme and public hostname, not the internal HTTP one.
            - name: KC_PROXY_HEADERS
              value: xforwarded

            # The public-facing URL that end users reach (login pages, token endpoints).
            # Update this to your actual domain before deploying.
            - name: KC_HOSTNAME
              value: "auth.weppino.com"

            # Restricts the admin console to the "localhost" hostname only.
            # This means the admin UI is NOT reachable at auth.weppino.com/admin — any
            # request with a Host header other than "localhost" is rejected by Keycloak.
            # To access the admin console in prod, use:
            #   kubectl port-forward svc/keycloak 8080:80 -n identity
            # then open http://localhost:8080
            - name: KC_HOSTNAME_ADMIN
              value: "localhost"

          ports:
            - containerPort: 8080
            - containerPort: 9000
              name: management

          # Production mode takes longer to start than dev mode (JVM warmup, DB migrations).
          # initialDelaySeconds is set higher than dev to avoid false-positive restarts.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3

          # Keycloak is memory-hungry due to the JVM. 512Mi request / 1Gi limit is a
          # conservative baseline for a single-realm, low-traffic deployment.
          # Adjust based on observed usage.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: identity
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 80
      targetPort: 8080
    # Management port exposed internally so the keycloak-config-cli Job initContainer
    # can poll /health/ready before applying realm config.
    - name: management
      port: 9000
      targetPort: 9000
