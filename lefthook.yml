pre-commit:
  parallel: true
  commands:
    java-checks:
      glob: "{libs,services}/**/*.java"
      run: bash scripts/java-checks-staged.sh

    ts-format:
      glob: "apps/**/*.{ts,tsx,json,yaml,css,md}"
      run: bash scripts/ts-format-staged.sh

    ts-lint:
      glob: "apps/**/*.{ts,tsx}"
      run: bash scripts/ts-lint-staged.sh
