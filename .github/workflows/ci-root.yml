---
# CI pipeline for root and cross-cutting files (Markdown, YAML, JSON).
#
# Runs on every pull request targeting main and on every push that lands on main.
# Quality gates (format check) are defined once in root-quality-gates.yml and
# called here. Fires only when relevant files change.
name: CI root files
run-name: "root files CI by @${{ github.actor }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── CHANGE DETECTION ────────────────────────────────────────────────────────
  # Skips quality gates when no MD/YAML/JSON files changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.filter.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            files:
              - '**/*.md'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.json'
              - '.prettierrc'
              - '.prettierignore'

  # ── QUALITY GATES ───────────────────────────────────────────────────────────
  quality-gates:
    needs: changes
    if: needs.changes.outputs.files == 'true'
    uses: ./.github/workflows/root-quality-gates.yml

  # ── CI RESULT ───────────────────────────────────────────────────────────────
  # Stable required check for branch protection. Passes when quality-gates
  # succeeded or was legitimately skipped (no relevant files changed).
  #
  # Branch protection required check name: "ci-result"
  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    needs: [quality-gates]
    if: always()
    steps:
      - name: Verify quality gates
        run: |
          result="${{ needs.quality-gates.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi
