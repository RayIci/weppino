---
# CI pipeline for the keycloak-theme Keycloakify project.
#
# Runs on every pull request targeting main and on every push that lands on main.
# Quality gates (format → lint → build) are defined once in
# frontend-quality-gates.yml and called here with keycloak-theme's project path.
# To add CI for a new frontend project, copy this file, update the paths in the
# 'changes' job, and update the 'with' inputs in the 'quality-gates' job.
name: CI keycloak-theme
run-name: "keycloak-theme CI by @${{ github.actor }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── CHANGE DETECTION ────────────────────────────────────────────────────────
  # Skips quality gates entirely when no keycloak-theme files changed,
  # avoiding a full Vite + Keycloakify build on unrelated PRs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/keycloak-theme/**'

  # ── QUALITY GATES ───────────────────────────────────────────────────────────
  quality-gates:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-quality-gates.yml
    with:
      project-dir: apps/keycloak-theme
      project-name: keycloak-theme
      build-command: build-keycloak-theme

  # ── CI RESULT ───────────────────────────────────────────────────────────────
  # Stable required check for branch protection. Passes when quality-gates
  # succeeded or was legitimately skipped (no keycloak-theme files changed).
  #
  # Branch protection required check name: "ci-result"
  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    needs: [quality-gates]
    if: always()
    steps:
      - name: Verify quality gates
        run: |
          result="${{ needs.quality-gates.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi
