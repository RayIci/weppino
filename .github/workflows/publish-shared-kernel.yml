---
name: Publish shared-kernel

# Triggers on version tags scoped to this library, e.g. shared-kernel-v0.1.0
on:
  push:
    tags:
      - "shared-kernel-v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # Required to upload packages to GitHub Packages
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Grant execute permission to gradlew
        run: chmod +x libs/shared-kernel/gradlew

      - name: Publish to GitHub Packages
        run: ./gradlew publish
        working-directory: libs/shared-kernel
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
